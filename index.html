<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login RemoPS2</title>
    <link rel="stylesheet" href="login.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Bitcount+Grid+Single:wght@100..900&family=Fascinate&family=Jersey+10&family=Pixelify+Sans:wght@400..700&family=Pompiere&display=swap"
        rel="stylesheet">
</head>

<body>

    <video autoplay muted loop playsinline id="video_1">
        <source
            src="assets/Firefly gere um video dessa roda girando devagar imitando o BROWSER DO PLAYSTATION 2 não adicione co.mp4"
            type="video/mp4">
    </video>

    <div class="header">
        <img src="assets/logo_ps2_pixelada_transparente.png" width="100px">
    </div>

    <div class="central">

        <div class="pai">
            <div class="texto">
                <h2>Olá Cadastre-se ou faça Login e começe sua jogatina</h2>
            </div>

            <div class="separar">

                <div class="imagen">
                    <img src="assets/Personagem Arcade Amarelo em Pixel Art.png" width="300px">
                    

                </div>

                <div class="formulario">
                    <div class="inputs">
                        <div class="area_gmail">
                            <label>Gmail</label>
                            <input placeholder="gmail" type="text" class="estilizacao_input" id="email">
                        </div>

                        <div class="area_senha">
                            <label>Senha</label>
                            <input placeholder="senha" type="password" class="estilizacao_input" id="password">
                            <a class="esqueci">Esqueci senha</a>
                        </div>

                    </div>

                    <div class="ajuda">


                        <a class="botao" href="pages/Home/index.html">Criar conta</a>
                        <button class="botao" id="entrar">Entrar</button>

                    </div>

                    <div class="login_outro">
                        <a> <img src="assets/Logotipo G Pixelado Colorido.png" width="15px">Google</a>
                    </div>
                </div>

            </div>


        </div>


    </div>

</body>
<script src="cadastro.js"></script>

</html>
